<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8301956364302084" crossorigin="anonymous"></script>
	<meta name="theme-color" content="#050b07">
	<link rel="stylesheet" href="economy.css?v=public-site-1">
	<title>Polly Track | Rocky Games</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Mono:wght@400;500&display=swap');

		:root {
			color-scheme: light;
			--ink: #202522;
			--paper: #f3f1e8;
			--lime: #d9f06b;
			--orange: #f36b45;
			--mono: 'DM Mono', monospace;
			--display: 'Barlow Condensed', Impact, sans-serif;
		}

		* { box-sizing: border-box; }
		body { min-height: 100vh; margin: 0; color: var(--ink); background: var(--paper) radial-gradient(#20252218 0.7px, transparent 0.7px) 0 0 / 8px 8px; font-family: var(--mono); }
		a { color: inherit; }
		.site-header { display: flex; align-items: center; justify-content: space-between; min-height: 68px; padding: 0 max(20px, calc((100vw - 1120px) / 2)); border-bottom: 2px solid var(--ink); background: var(--paper); }
		.brand { display: flex; align-items: center; gap: 9px; font: 900 22px/1 var(--display); text-decoration: none; text-transform: uppercase; }
		.brand-mark { display: grid; width: 30px; aspect-ratio: 1; place-items: center; border: 2px solid var(--ink); background: var(--lime); font: 500 15px var(--mono); }
		.home-link { font-size: 10px; text-transform: uppercase; text-underline-offset: 4px; }
		main { width: min(100% - 40px, 1120px); margin: 0 auto; }
		.page-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; padding: 38px 0 20px; }
		.kicker { margin: 0 0 6px; color: #52645b; font-size: 10px; text-transform: uppercase; }
		h1 { margin: 0; font: 900 clamp(48px, 8vw, 84px)/0.9 var(--display); text-transform: uppercase; }
		.game-wrap { position: relative; width: 100%; height: min(72vh, 720px); min-height: 420px; border: 2px solid var(--ink); background: #202522; box-shadow: 7px 7px 0 var(--ink); }
		.game-frame { display: block; width: 100%; height: 100%; border: 0; background: #202522; }
		footer { display: flex; justify-content: space-between; gap: 16px; width: min(100% - 40px, 1120px); margin: 32px auto 0; padding: 14px 0 22px; border-top: 1px solid #20252266; color: #52645b; font-size: 9px; text-transform: uppercase; }
		@media (max-width: 600px) {
			.site-header { min-height: 60px; padding: 0 14px; }
			main, footer { width: calc(100% - 28px); }
			.page-heading { padding-top: 28px; }
			.game-wrap { height: 72vh; min-height: 380px; box-shadow: 4px 4px 0 var(--ink); }
		}
		@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; } }
	</style>
</head>
<body>
	<header class="site-header">
		<a class="brand" href="index.html" aria-label="Rocky Games home"><span class="brand-mark" aria-hidden="true">R</span> Rocky Games</a>
		<a class="home-link" href="index.html">← Arcade home</a>
	</header>

	<main>
		<section class="page-heading" aria-labelledby="page-title">
			<div>
				<p class="kicker">Arcade / Racing</p>
				<h1 id="page-title">Polly Track</h1>
			</div>
		</section>

		<div class="game-wrap" id="gameWrap" data-game-fullscreen>
	<iframe
		id="gameFrame"
		class="game-frame"
		title="Polly Track game"
		src="https://iloveshorty.github.io/play/?id=739"
		allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope"
		allowfullscreen
		referrerpolicy="strict-origin-when-cross-origin"></iframe>
		</div>
	</main>

	<footer><span>Rocky Games</span><span>Polly Track</span></footer>
	<script src="economy.js?v=public-site-3" defer></script>
</body>
</html>
