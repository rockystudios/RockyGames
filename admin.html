<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>Admin | Rocky Games</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; padding: 20px; color: #202522; background: #f3f1e8; font-family: 'DM Mono', monospace; }
		main { width: min(100%, 760px); margin: 0 auto; }
		h1 { text-transform: uppercase; }
		input, button { padding: 6px 10px; font: inherit; }
		table { width: 100%; border-collapse: collapse; font-size: 13px; }
		th, td { padding: 6px; border-bottom: 1px solid #202522; text-align: left; }
		td input[type="number"] { width: 110px; }
		#status { min-height: 1.4em; }
		[hidden] { display: none; }
	</style>
</head>
<body>
	<main>
		<h1>Admin panel</h1>
		<form id="login">
			<label>Admin password <input id="admin-password" type="password" autocomplete="off" required></label>
			<button type="submit">Unlock</button>
		</form>
		<p id="status" role="status" aria-live="polite"></p>
		<section id="panel" hidden>
			<button type="button" id="refresh">Refresh</button>
			<table>
				<thead><tr><th scope="col">ID</th><th scope="col">Username</th><th scope="col">Coins</th><th scope="col">Actions</th></tr></thead>
				<tbody id="rows"></tbody>
			</table>
		</section>
	</main>
	<script src="access-code.js?v=1"></script>
	<script>
		(function () {
			const URL_BASE = 'https://elxnypvvwrumhwakczwe.supabase.co';
			const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVseG55cHZ2d3J1bWh3YWtjendlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNTk0OTAsImV4cCI6MjEwODczNTQ5MH0.j3jNeub4wRWFeW_FCtA2fGm310lmVNlV_UqpwnrE-Yw';
			const status = document.querySelector('#status');
			const rowsEl = document.querySelector('#rows');

			async function api(query, options = {}) {
				const response = await fetch(`${URL_BASE}/rest/v1/account${query}`, {
					...options,
					headers: { apikey: KEY, Authorization: `Bearer ${KEY}`, 'Content-Type': 'application/json', Prefer: 'return=representation' }
				});
				if (!response.ok) throw new Error(`Server error ${response.status}`);
				return response.json();
			}

			async function load() {
				status.textContent = 'Loading…';
				try {
					const accounts = await api('?select=id,username,coins,bgs&order=coins.desc');
					rowsEl.replaceChildren();
					accounts.forEach((account) => {
						const tr = document.createElement('tr');
						const cell = (content) => { const td = document.createElement('td'); td.append(content); tr.append(td); return td; };
						cell(String(account.id));
						const banned = Boolean(account.bgs && account.bgs.banned);
						cell(banned ? `${account.username} (BANNED)` : account.username);
						const coins = document.createElement('input');
						coins.type = 'number';
						coins.min = '0';
						coins.step = '1';
						coins.value = account.coins;
						coins.setAttribute('aria-label', `Coins for ${account.username}`);
						cell(coins);
						const actions = document.createElement('td');
						const save = document.createElement('button');
						save.type = 'button';
						save.textContent = 'Set coins';
						save.addEventListener('click', async () => {
							const value = Number(coins.value);
							if (!Number.isSafeInteger(value) || value < 0 || value > 2000000000) { status.textContent = 'Coins must be a whole number from 0 to 2,000,000,000.'; return; }
							try {
								await api(`?id=eq.${account.id}`, { method: 'PATCH', body: JSON.stringify({ coins: value }) });
								status.textContent = `${account.username} now has ${value} coins.`;
							} catch (error) { status.textContent = error.message; }
						});
						const del = document.createElement('button');
						del.type = 'button';
						del.textContent = banned ? 'Remove ban record' : 'Delete';
						del.addEventListener('click', async () => {
							if (!confirm(`Delete account "${account.username}"? This cannot be undone.`)) return;
							const ban = !banned && confirm(`Also ban "${account.username}"? OK = ban every device signed in to this account. Cancel = just delete it.`);
							try {
								if (ban) {
									const randomPassword = [...crypto.getRandomValues(new Uint8Array(24))].map((b) => b.toString(16).padStart(2, '0')).join('');
									await api(`?id=eq.${account.id}`, { method: 'PATCH', body: JSON.stringify({ coins: 0, password: randomPassword, bgs: { banned: true }, nameplates: {} }) });
									status.textContent = `Banned ${account.username}. Devices are blocked the next time they check in.`;
								} else {
									await api(`?id=eq.${account.id}`, { method: 'DELETE' });
									status.textContent = `Deleted ${account.username}.`;
								}
								load();
							} catch (error) { status.textContent = error.message; }
						});
						actions.append(save, ' ', del);
						tr.append(actions);
						rowsEl.append(tr);
					});
					status.textContent = `${accounts.length} accounts.`;
				} catch (error) { status.textContent = error.message; }
			}

			document.querySelector('#login').addEventListener('submit', async (event) => {
				event.preventDefault();
				if (!(await window.RockyAccess.isValidAccessCode(document.querySelector('#admin-password').value))) {
					status.textContent = 'Wrong password.';
					return;
				}
				document.querySelector('#login').hidden = true;
				document.querySelector('#panel').hidden = false;
				load();
			});
			document.querySelector('#refresh').addEventListener('click', load);
		})();
	</script>
</body>
</html>
