<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8301956364302084" crossorigin="anonymous"></script>
	<meta name="theme-color" content="#b8860b">
	<title>Browser | Rocky Games+</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Mono:wght@400;500&display=swap');

		:root { color-scheme: light; --ink: #30230b; --gold: #e5be54; --paper: #fff3ca; --mono: 'DM Mono', monospace; --display: 'Barlow Condensed', Impact, sans-serif; }
		* { box-sizing: border-box; }
		body { min-height: 100vh; margin: 0; color: var(--ink); background: radial-gradient(#30230b16 0.7px, transparent 0.7px), linear-gradient(145deg, #f8e6a5, #d5a632 58%, #f5d878); background-size: 8px 8px, cover; font-family: var(--mono); }
		a { color: inherit; }
		.site-header { display: flex; align-items: center; justify-content: space-between; min-height: 76px; padding: 0 max(24px, calc((100vw - 1120px) / 2)); border-bottom: 2px solid var(--ink); background: #f8e6a5; }
		.brand { display: flex; align-items: center; gap: 10px; font: 900 25px/1 var(--display); text-decoration: none; text-transform: uppercase; }
		.brand-mark { display: grid; width: 32px; aspect-ratio: 1; place-items: center; border: 2px solid var(--ink); background: var(--gold); font: 500 16px var(--mono); }
		.home-link { padding: 10px 14px; border: 2px solid var(--ink); background: var(--paper); box-shadow: 3px 3px 0 var(--ink); font-size: 10px; text-decoration: none; text-transform: uppercase; }
		main { width: min(100% - 48px, 1120px); margin: 0 auto; }
		.page-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; padding: 38px 0 20px; }
		.kicker { margin: 0 0 6px; font-size: 10px; text-transform: uppercase; }
		h1 { margin: 0; font: 900 clamp(42px, 8vw, 76px)/0.9 var(--display); text-transform: uppercase; }
		.game-wrap { position: relative; width: 100%; height: min(76vh, 760px); min-height: 420px; overflow: hidden; border: 2px solid var(--ink); background: #fff; box-shadow: 7px 7px 0 var(--ink); }
		.game-frame { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
		footer { display: flex; justify-content: space-between; gap: 16px; width: min(100% - 48px, 1120px); margin: 32px auto 0; padding: 14px 0 22px; border-top: 1px solid #30230b66; font-size: 9px; text-transform: uppercase; }
		@media (max-width: 600px) { .site-header { min-height: 60px; padding: 0 14px; } main, footer { width: calc(100% - 28px); } .page-heading { padding-top: 28px; } .game-wrap { height: 76vh; min-height: 380px; box-shadow: 4px 4px 0 var(--ink); } }
		@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; } }
	</style>
</head>
<body>
	<header class="site-header">
		<a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">R+</span> Rocky Games+</a>
		<a class="home-link" href="games-plus.html">← Games+</a>
	</header>
	<main>
		<section class="page-heading" aria-labelledby="page-title">
			<div><p class="kicker">Rocky Games+ / Extra</p><h1 id="page-title">Browser</h1></div>
		</section>
		<section class="game-wrap" aria-label="Browser game">
			<iframe class="game-frame" src="https://s3.amazonaws.com/lotoso/index.html" title="Browser game" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-presentation" allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope; pointer-lock" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
		</section>
	</main>
	<footer><span>Rocky Games+</span><span>Browser</span></footer>
</body>
</html>
