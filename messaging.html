<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#050b07">
	<title>Messaging | Rocky Games</title>
	<link rel="stylesheet" href="economy.css?v=public-site-35">
	<script src="economy.js?v=public-site-35" defer></script>
	<style>
		:root { color-scheme: light; --ink: #202522; --paper: #f3f1e8; --lime: #d9f06b; --orange: #f36b45; }
		* { box-sizing: border-box; }
		body { min-height: 100vh; margin: 0; color: var(--ink); background: var(--paper); font-family: 'DM Mono', monospace; }
		a { color: inherit; }
		header { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 68px; padding: 12px 20px; border-bottom: 2px solid var(--ink); }
		.brand { font: 900 23px/1 sans-serif; text-decoration: none; text-transform: uppercase; }
		.home-link { font-size: 11px; text-transform: uppercase; }
		main { display: grid; width: min(100% - 40px, 900px); min-height: calc(100vh - 70px); align-content: center; margin: 0 auto; padding: 48px 0 80px; }
		.kicker { margin: 0 0 12px; font-size: 11px; text-transform: uppercase; }
		h1 { margin: 0; font: 900 clamp(48px, 10vw, 88px)/0.9 'Barlow Condensed', Impact, sans-serif; text-transform: uppercase; }
		p:last-child { margin: 18px 0 0; font-size: 14px; line-height: 1.7; }
		@media (max-width: 540px) {
			header { min-height: 60px; padding: 10px 14px; }
			main { width: calc(100% - 28px); }
		}
	</style>
</head>
<body>
	<header>
		<a class="brand" href="index.html">Rocky Games</a>
		<a class="home-link" href="index.html">&larr; Arcade home</a>
	</header>
	<main>
		<div>
			<p class="kicker">Rocky Games / Messaging</p>
			<h1>Coming soon.</h1>
			<p>Messaging is not available yet. Check back soon.</p>
		</div>
	</main>
</body>
</html>
