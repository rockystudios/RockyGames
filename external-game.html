<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8301956364302084" crossorigin="anonymous"></script>
	<meta name="theme-color" content="#050b07">
	<link rel="stylesheet" href="economy.css?v=public-site-7">
	<title>Arcade Game | Rocky Games</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Mono:wght@400;500&display=swap');

		:root {
			color-scheme: light;
			--ink: #202522;
			--paper: #f3f1e8;
			--lime: #d9f06b;
			--orange: #f36b45;
			--mono: 'DM Mono', monospace;
			--display: 'Barlow Condensed', Impact, sans-serif;
		}

		* { box-sizing: border-box; }
		body { min-height: 100vh; margin: 0; color: var(--ink); background: var(--paper) radial-gradient(#20252218 0.7px, transparent 0.7px) 0 0 / 8px 8px; font-family: var(--mono); }
		a { color: inherit; }
		.site-header { display: flex; align-items: center; justify-content: space-between; min-height: 68px; padding: 0 max(20px, calc((100vw - 1120px) / 2)); border-bottom: 2px solid var(--ink); background: var(--paper); }
		.brand { display: flex; align-items: center; gap: 9px; font: 900 22px/1 var(--display); text-decoration: none; text-transform: uppercase; }
		.brand-mark { display: grid; width: 30px; aspect-ratio: 1; place-items: center; border: 2px solid var(--ink); background: var(--lime); font: 500 15px var(--mono); }
		.home-link { font-size: 10px; text-transform: uppercase; text-underline-offset: 4px; }
		main { width: min(100% - 40px, 1120px); margin: 0 auto; }
		.page-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; padding: 38px 0 20px; }
		.kicker { margin: 0 0 6px; color: #52645b; font-size: 10px; text-transform: uppercase; }
		h1 { margin: 0; font: 900 clamp(42px, 8vw, 76px)/0.9 var(--display); text-transform: uppercase; }
		.game-wrap { position: relative; width: 100%; height: min(76vh, 760px); min-height: 420px; overflow: hidden; border: 2px solid var(--ink); background: #202522; box-shadow: 7px 7px 0 var(--ink); }
		.game-frame { display: block; width: 100%; height: 100%; border: 0; background: #202522; }
		.game-frame[hidden] { display: none; }
		.game-message { padding: 28px; color: var(--paper); font-size: 12px; line-height: 1.7; }
		.game-message[hidden] { display: none; }
		footer { display: flex; justify-content: space-between; gap: 16px; width: min(100% - 40px, 1120px); margin: 32px auto 0; padding: 14px 0 22px; border-top: 1px solid #20252266; color: #52645b; font-size: 9px; text-transform: uppercase; }
		@media (max-width: 600px) {
			.site-header { min-height: 60px; padding: 0 14px; }
			main, footer { width: calc(100% - 28px); }
			.page-heading { padding-top: 28px; }
			.game-wrap { height: 76vh; min-height: 380px; box-shadow: 4px 4px 0 var(--ink); }
		}
		@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; } }
	</style>
</head>
<body>
	<header class="site-header">
		<a class="brand" href="index.html" aria-label="Rocky Games home"><span class="brand-mark" aria-hidden="true">R</span> Rocky Games</a>
		<a class="home-link" href="index.html">&larr; Arcade home</a>
	</header>

	<main>
		<section class="page-heading" aria-labelledby="page-title">
			<div><p class="kicker" id="gameCategory">Arcade / External game</p><h1 id="page-title">Loading game...</h1></div>
		</section>
		<section class="game-wrap" data-game-fullscreen aria-label="Game player">
			<iframe class="game-frame" id="gameFrame" title="Game loading" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-presentation" allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope; pointer-lock" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" hidden></iframe>
			<p class="game-message" id="gameMessage" role="status" hidden></p>
		</section>
	</main>

	<footer><span>Rocky Games</span><span id="gameFooter">Arcade game</span></footer>
	<script>
		(() => {
			const games = {
				'project-sand': { title: 'Project Sand', category: 'Sandbox / Creative / Physics', url: 'https://tunnle-rush-2025.github.io/projects/project-sand/index.html' },
				'weave-silk': { title: 'Weave Silk', category: 'Creative / Art / Drawing', url: 'https://weavesilk.com/' },
				'moto-x3m-pool-party': { title: 'Moto X3M Pool Party', category: 'Arcade / Motorbike / Racing', url: 'https://tunnle-rush-2025.github.io/projects/moto-x3m-pool-party/index.html' },
				'moto-x3m-winter': { title: 'Moto X3M Winter', category: 'Arcade / Motorbike / Racing', url: 'https://tunnle-rush-2025.github.io/projects/moto-x3m-winter/index.html' },
				'moto-x3m-2': { title: 'Moto X3M 2', category: 'Arcade / Motorbike / Racing', url: 'https://tunnle-rush-2025.github.io/projects/moto-x3m-2/index.html' },
				'moto-x3m-spooky-land': { title: 'Moto X3M Spooky Land', category: 'Arcade / Motorbike / Racing', url: 'https://tunnle-rush-2025.github.io/projects/moto-x3m-spooky-land/index.html' },
				'death-run-3d': { title: 'Death Run 3D', category: 'Arcade / 3D / Reflex', url: 'https://tunnle-rush-2025.github.io/projects/death-run-3d/index.html' },
				'ctr-time-travel': { title: 'CTR Time Travel', category: 'Arcade / Racing / Driving', url: 'https://tunnle-rush-2025.github.io/projects/ctr-time-travel/index.html' },
				'idle-shark': { title: 'Idle Shark', category: 'Idle / Clicker / Browser game', url: 'https://skiingbeast2025.github.io/lunamix/play.html?game=idle-shark' },
				'web-dashers': { title: 'Web Dashers', category: 'Arcade / Rhythm / Platformer', url: 'https://skiingbeast2025.github.io/webdickers/' },
				'bit-planes': { title: 'Bit Planes', category: 'Arcade / Browser game', url: 'https://iloveshorty.github.io/play/?id=691' },
				'golf-orbit': { title: 'Golf Orbit', category: 'Sports / Golf / Browser game', url: 'https://iloveshorty.github.io/strongdog3/html/golf%20orbit/index.html' },
				'hover-racer': { title: 'Hover Racer', category: 'Arcade / Browser game', url: 'https://iloveshorty.github.io/play/?id=297' },
				'shorty-881': { title: 'Shorty Game 881', category: 'Arcade / Browser game', url: 'https://iloveshorty.github.io/play/?id=881' },
				'shorty-207': { title: 'Shorty Game 207', category: 'Arcade / Browser game', url: 'https://iloveshorty.github.io/play/?id=207' },
				bitlife: { title: 'BitLife', category: 'Simulation / Life / Choices', url: 'https://tunnle-rush-2025.github.io/projects/bitlife/index.html' },
				'ball-sort-puzzle': { title: 'Ball Sort Puzzle', category: 'Puzzle / Logic / Sorting', url: 'https://tunnle-rush-2025.github.io/projects/ball-sort-puzzle/index.html' },
				'cookie-clicker': { title: 'Cookie Clicker', category: 'Strategy / Idle / Clicker', url: 'https://tunnle-rush-2025.github.io/projects/cookie-clicker/index.html' },
				minesweeper: { title: 'Minesweeper', category: 'Puzzle / Logic / Classic', url: 'https://tunnle-rush-2025.github.io/projects/minesweeper/index.html' },
				'fnaf-1': { title: 'FNAF 1', category: 'Horror / Survival / Strategy', url: 'https://tunnle-rush-2025.github.io/projects/fnaf-1/index.html' },
				slope: { title: 'Slope', category: 'Arcade / 3D / Reflex', url: 'https://tunnle-rush-2025.github.io/projects/slope/index.html' },
				'stickman-hook': { title: 'Stickman Hook', category: 'Arcade / Platformer / Reflex', url: 'https://tunnle-rush-2025.github.io/projects/stickman-hook/index.html' }
			};
			const game = games[new URLSearchParams(window.location.search).get('game')];
			const frame = document.querySelector('#gameFrame');
			const message = document.querySelector('#gameMessage');
			const title = document.querySelector('#page-title');
			const footer = document.querySelector('#gameFooter');

			if (game) {
				document.title = `${game.title} | Rocky Games`;
				title.textContent = game.title;
				document.querySelector('#gameCategory').textContent = game.category;
				footer.textContent = game.title;
				frame.title = `${game.title} game`;
				frame.src = game.url;
				frame.hidden = false;
			} else {
				document.title = 'Game not found | Rocky Games';
				title.textContent = 'Game not found';
				message.textContent = 'This game link is not available. Return to the arcade to choose another game.';
				message.hidden = false;
				footer.textContent = 'Game not found';
			}
		})();
	</script>
	<script src="economy.js?v=public-site-18" defer></script>
</body>
</html>
